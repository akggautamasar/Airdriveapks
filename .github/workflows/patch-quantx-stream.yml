name: Patch Quantx Streaming

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch viewer streaming
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p = Path('app/src/main/java/com/airdrive/backup/quantx/QuantxDriveViewerScreen.kt')
          s = p.read_text()
          if 'DefaultHttpDataSource' in s and 'authToken: String?' in s:
              print('Streaming patch already present')
              raise SystemExit(0)
          s = s.replace('import androidx.media3.exoplayer.ExoPlayer\n', 'import androidx.media3.exoplayer.ExoPlayer\nimport androidx.media3.exoplayer.source.DefaultMediaSourceFactory\nimport androidx.media3.datasource.DefaultHttpDataSource\n')
          start = s.index('@OptIn(UnstableApi::class)\n@Composable\nprivate fun RemotePlayer')
          end = s.index('\n\n@Composable\nprivate fun RemoteImage', start)
          replacement = base64.b64decode('').decode()
          s = s[:start] + replacement + s[end:]
          s = s.replace('RemotePlayer(api.mediaUrl(file.id), file.mime, false, fullscreen, ::setFullscreen)', 'RemotePlayer(api.mediaUrl(file.id), file.mime, false, fullscreen, ::setFullscreen, api.savedToken)')
          s = s.replace('RemotePlayer(api.mediaUrl(file.id), file.mime, true, fullscreen, ::setFullscreen)', 'RemotePlayer(api.mediaUrl(file.id), file.mime, true, fullscreen, ::setFullscreen, api.savedToken)')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/airdrive/backup/quantx/QuantxDriveViewerScreen.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(quantx): make video streaming authenticated and adaptive"
          git push
