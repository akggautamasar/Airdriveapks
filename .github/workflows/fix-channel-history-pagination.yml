name: Fix channel history pagination

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/fix-channel-history-pagination.yml

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch TDLib history scanner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/airdrive/backup/telegram/TdClient.kt")
          s = p.read_text()
          old = '''        var pages = 0
        while (pages < 10000) {
            val history = send(TdApi.GetChatHistory().apply { this.chatId = chatId; this.fromMessageId = fromMessageId; offset = 0; limit = 100; onlyLocal = false }) as TdApi.Messages
            if (history.messages.isEmpty()) break
            pages++
            history.messages.forEach { message ->
                telegramFileFromMessage(message, chatId)?.let { result += it }
            }
            onPage(result.size)
            val oldest = history.messages.minOf { it.id }
            if (oldest <= 1L || oldest == fromMessageId) break
            fromMessageId = oldest
            if (history.messages.size < 100) break
        }
'''
          new = '''        var pages = 0
        while (true) {
            val history = send(TdApi.GetChatHistory().apply { this.chatId = chatId; this.fromMessageId = fromMessageId; offset = 0; limit = 100; onlyLocal = false }) as TdApi.Messages
            if (history.messages.isEmpty()) break
            pages++
            history.messages.forEach { message ->
                telegramFileFromMessage(message, chatId)?.let { result += it }
            }
            onPage(result.size)
            // TDLib explicitly allows fewer than the requested limit even when older
            // history still exists. Never treat a short page as end-of-history.
            val oldest = history.messages.last().id
            if (oldest <= 1L || oldest == fromMessageId) break
            fromMessageId = oldest
        }
'''
          if old not in s:
              raise SystemExit("Expected scanner block not found")
          p.write_text(s.replace(old, new))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/airdrive/backup/telegram/TdClient.kt
          git commit -m "Fix Telegram channel history pagination" || exit 0
          git push
