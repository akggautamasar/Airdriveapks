name: Repair ChannelConfig
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message != 'Repair ChannelConfig Kotlin syntax'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair malformed one-line TextButton
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/airdrive/backup/ui/screens/ChannelConfigScreen.kt')
          s = p.read_text()
          old = '''                            TextButton(\n                                onClick = { working = category; scope.launch { try { val created = repository.createChannel("AirDrive ${categoryLabel(category)}"); text = created.chatId.toString(); assign(category, created.chatId, created.title) } catch (e: Exception) { say(e.message ?: "Could not create the channel", true) } finally { working = null } },\n                                enabled = working == null && !syncState.running\n                            ) { Text("Create") }'''
          new = '''                            TextButton(\n                                onClick = {\n                                    working = category\n                                    scope.launch {\n                                        try {\n                                            val created = repository.createChannel("AirDrive ${categoryLabel(category)}")\n                                            text = created.chatId.toString()\n                                            assign(category, created.chatId, created.title)\n                                        } catch (e: Exception) {\n                                            say(e.message ?: "Could not create the channel", true)\n                                        } finally {\n                                            working = null\n                                        }\n                                    }\n                                },\n                                enabled = working == null && !syncState.running\n                            ) { Text("Create") }'''
          if old not in s:
              raise SystemExit('Expected malformed TextButton block was not found')
          p.write_text(s.replace(old, new))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/airdrive/backup/ui/screens/ChannelConfigScreen.kt
          git commit -m 'Repair ChannelConfig Kotlin syntax'
          git push
