name: Fix FileViewer compile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix shadowed PlayerView property
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/airdrive/backup/ui/screens/FileViewerScreen.kt')
          s = p.read_text()
          old = 'PlayerView(ctx).apply { player = player; useController = true;'
          new = 'PlayerView(ctx).apply { this.player = player; useController = true;'
          if old not in s:
              raise SystemExit('target text not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/airdrive/backup/ui/screens/FileViewerScreen.kt
          git diff --cached --quiet || git commit -m 'Fix PlayerView property assignment'
          git push
