name: Run ChannelConfig syntax repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message != 'ChannelConfig syntax fix applied'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/airdrive/backup/ui/screens/ChannelConfigScreen.kt')
          s=p.read_text()
          start=s.index('                            TextButton(\n                                onClick = { working = category;')
          end=s.index('                            Spacer(Modifier.width(8.dp))', start)
          new='''                            TextButton(\n                                onClick = {\n                                    working = category\n                                    scope.launch {\n                                        try {\n                                            val created = repository.createChannel("AirDrive ${categoryLabel(category)}")\n                                            text = created.chatId.toString()\n                                            assign(category, created.chatId, created.title)\n                                        } catch (e: Exception) {\n                                            say(e.message ?: "Could not create the channel", true)\n                                        } finally {\n                                            working = null\n                                        }\n                                    }\n                                },\n                                enabled = working == null && !syncState.running\n                            ) { Text("Create") }\n'''
          p.write_text(s[:start]+new+s[end:])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/airdrive/backup/ui/screens/ChannelConfigScreen.kt
          git commit -m 'ChannelConfig syntax fix applied'
          git push
