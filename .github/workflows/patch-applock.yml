name: Patch optional app lock
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-applock.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        shell: bash
        run: |
          git checkout 2297d127032e9efa89f47ba46d74e89a058c46cd -- app/src/main/java/com/airdrive/backup/data/prefs/SettingsStore.kt
          python3 - <<'PY'
          from pathlib import Path
          def edit(path, old, new):
              p=Path(path); s=p.read_text()
              assert old in s, path + ': missing pattern'
              p.write_text(s.replace(old,new,1))
          edit('app/src/main/java/com/airdrive/backup/data/prefs/SettingsStore.kt','val INSTALL_GENERATION = intPreferencesKey("install_generation")','val INSTALL_GENERATION = intPreferencesKey("install_generation")\n    val APP_LOCK_ENABLED = booleanPreferencesKey("app_lock_enabled")')
          edit('app/src/main/java/com/airdrive/backup/data/prefs/SettingsStore.kt','val autoRetryFailed: Flow<Boolean> = context.dataStore.data.map { it[Keys.AUTO_RETRY_FAILED] ?: true }','val autoRetryFailed: Flow<Boolean> = context.dataStore.data.map { it[Keys.AUTO_RETRY_FAILED] ?: true }\n    val appLockEnabled: Flow<Boolean> = context.dataStore.data.map { it[Keys.APP_LOCK_ENABLED] ?: false }\n    suspend fun setAppLockEnabled(enabled: Boolean) { context.dataStore.edit { it[Keys.APP_LOCK_ENABLED] = enabled } }')
          edit('app/build.gradle.kts','implementation("androidx.activity:activity-compose:1.9.1")','implementation("androidx.activity:activity-compose:1.9.1")\n    implementation("androidx.biometric:biometric:1.1.0")')
          edit('app/src/main/java/com/airdrive/backup/ui/nav/AppNav.kt','const val SECURITY_PRIVACY = "security_privacy"','const val SECURITY_PRIVACY = "security_privacy"\n    const val APP_LOCK = "app_lock"')
          edit('app/src/main/java/com/airdrive/backup/ui/nav/AppNav.kt','composable(Routes.SECURITY_PRIVACY) { SecurityPrivacyScreen(navController) }','composable(Routes.SECURITY_PRIVACY) { SecurityPrivacyScreen(navController) }\n            composable(Routes.APP_LOCK) { AppLockSettingsScreen(navController) }')
          edit('app/src/main/java/com/airdrive/backup/ui/screens/SettingsOverviewScreen.kt','SettingsRow("Security & Privacy", "Credentials, cloud data and privacy", Icons.Default.Lock, Orange, OrangeLight) { nav.navigate(Routes.SECURITY_PRIVACY) }','SettingsRow("Security & Privacy", "Credentials, cloud data and privacy", Icons.Default.Lock, Orange, OrangeLight) { nav.navigate(Routes.SECURITY_PRIVACY) }\n                SettingsRow("App Lock", "Optional biometric or device PIN protection", Icons.Default.Lock, Orange, OrangeLight) { nav.navigate(Routes.APP_LOCK) }')
          edit('app/src/main/java/com/airdrive/backup/MainActivity.kt','import android.os.Bundle','import android.os.Bundle\nimport android.os.SystemClock\nimport androidx.biometric.BiometricManager\nimport androidx.biometric.BiometricPrompt\nimport androidx.core.content.ContextCompat\nimport androidx.lifecycle.lifecycleScope\nimport kotlinx.coroutines.flow.first')
          edit('app/src/main/java/com/airdrive/backup/MainActivity.kt','class MainActivity : ComponentActivity() {\n    override fun onCreate','''class MainActivity : ComponentActivity() {
    private var lockAuthenticating = false
    private var hasResumedOnce = false
    private var pausedAt = 0L

    override fun onResume() {
        super.onResume()
        val shouldPrompt = !hasResumedOnce || pausedAt == 0L || SystemClock.elapsedRealtime() - pausedAt > 700L
        hasResumedOnce = true
        if (shouldPrompt) maybePromptForAppLock()
    }

    override fun onPause() {
        pausedAt = SystemClock.elapsedRealtime()
        super.onPause()
    }

    private fun maybePromptForAppLock() {
        if (lockAuthenticating) return
        val settings = SettingsStore(this)
        lifecycleScope.launchWhenResumed {
            if (!settings.appLockEnabled.first() || isFinishing || isChangingConfigurations) return@launchWhenResumed
            val authenticators = BiometricManager.Authenticators.BIOMETRIC_STRONG or BiometricManager.Authenticators.DEVICE_CREDENTIAL
            if (BiometricManager.from(this@MainActivity).canAuthenticate(authenticators) != BiometricManager.BIOMETRIC_SUCCESS) return@launchWhenResumed
            lockAuthenticating = true
            val prompt = BiometricPrompt(this@MainActivity, ContextCompat.getMainExecutor(this@MainActivity), object : BiometricPrompt.AuthenticationCallback() {
                override fun onAuthenticationSucceeded(result: BiometricPrompt.AuthenticationResult) { lockAuthenticating = false }
                override fun onAuthenticationError(errorCode: Int, errString: CharSequence) { lockAuthenticating = false }
                override fun onAuthenticationFailed() = Unit
            })
            prompt.authenticate(BiometricPrompt.PromptInfo.Builder()
                .setTitle("Unlock AirDrive")
                .setSubtitle("Authenticate to access your backups and files")
                .setAllowedAuthenticators(authenticators)
                .setNegativeButtonText("Cancel")
                .build())
        }
    }

    override fun onCreate''')
          PY
          cat > app/src/main/java/com/airdrive/backup/ui/screens/AppLockSettingsScreen.kt <<'KOT'
          package com.airdrive.backup.ui.screens
          import androidx.biometric.BiometricManager
          import androidx.compose.foundation.layout.*
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Fingerprint
          import androidx.compose.material.icons.filled.Lock
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          import androidx.navigation.NavHostController
          import com.airdrive.backup.data.prefs.SettingsStore
          import kotlinx.coroutines.launch

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun AppLockSettingsScreen(nav: NavHostController) {
              val context = androidx.compose.ui.platform.LocalContext.current
              val settings = remember { SettingsStore(context) }
              val enabled by settings.appLockEnabled.collectAsState(initial = false)
              val scope = rememberCoroutineScope()
              val authenticators = BiometricManager.Authenticators.BIOMETRIC_STRONG or BiometricManager.Authenticators.DEVICE_CREDENTIAL
              val available = remember(context) { BiometricManager.from(context).canAuthenticate(authenticators) == BiometricManager.BIOMETRIC_SUCCESS }
              Scaffold(topBar = { TopAppBar(title = { Text("App Lock") }) }) { padding ->
                  Column(Modifier.fillMaxSize().padding(padding).padding(20.dp), verticalArrangement = Arrangement.spacedBy(18.dp)) {
                      Card {
                          Row(Modifier.fillMaxWidth().padding(18.dp), verticalAlignment = Alignment.CenterVertically) {
                              Icon(Icons.Default.Fingerprint, null, modifier = Modifier.size(42.dp), tint = MaterialTheme.colorScheme.primary)
                              Spacer(Modifier.width(16.dp))
                              Column(Modifier.weight(1f)) {
                                  Text("Protect AirDrive", style = MaterialTheme.typography.titleLarge)
                                  Text("Ask for biometric or device PIN when AirDrive opens.", style = MaterialTheme.typography.bodyMedium, color = MaterialTheme.colorScheme.onSurfaceVariant)
                              }
                              Switch(checked = enabled, enabled = available, onCheckedChange = { value -> scope.launch { settings.setAppLockEnabled(value) } })
                          }
                      }
                      Text(if (available) "Optional and OFF by default. AirDrive never stores your fingerprint, face data, PIN, or password." else "Set up a secure device lock or supported biometric in Android Settings first.", color = if (available) MaterialTheme.colorScheme.onSurfaceVariant else MaterialTheme.colorScheme.error)
                      OutlinedButton(onClick = { nav.popBackStack() }, modifier = Modifier.fillMaxWidth()) { Icon(Icons.Default.Lock, null); Spacer(Modifier.width(8.dp)); Text("Done") }
                  }
              }
          }
          KOT
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          git commit -m 'Add optional biometric app lock'
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/patch-applock.yml
          git commit -m 'chore: remove temporary app lock patch workflow'
          git push
