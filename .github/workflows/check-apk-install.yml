name: Check published APK installation

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/check-apk-install.yml"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [google_apis, google_apis_ps16k]
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Download the exact reported APK
        run: |
          gh release download cloud-drive-42801846505 --pattern AirDrive-cloud-drive-debug.apk --dir apk
          gh release download cloud-drive-42801846505 --pattern SHA256SUMS.txt --dir apk
          (cd apk && sha256sum --check SHA256SUMS.txt)
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Fresh installation on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          system-image-api-level: '37.0'
          arch: x86_64
          target: ${{ matrix.target }}
          disable-animations: true
          script: |
            adb shell getprop ro.build.version.release
            adb shell getconf PAGE_SIZE
            adb install --no-streaming apk/AirDrive-cloud-drive-debug.apk
            adb shell pm path com.airdrive.backup.debug
