name: Repair BackupRepository syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair malformed newline escapes and diagnose braces
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/airdrive/backup/data/repo/BackupRepository.kt')
          text = path.read_text()
          fixed = text.replace('\\\\\n', '\\\\n')
          if fixed != text:
              path.write_text(fixed)
              text = fixed
              print('Repaired malformed newline escape(s).')
          else:
              print('No malformed newline escape found.')

          balance = 0
          in_string = None
          escaped = False
          in_line_comment = False
          in_block_comment = False
          for line_no, line in enumerate(text.splitlines(), 1):
              i = 0
              while i < len(line):
                  ch = line[i]
                  nxt = line[i + 1] if i + 1 < len(line) else ''
                  if in_line_comment:
                      break
                  if in_block_comment:
                      if ch == '*' and nxt == '/':
                          in_block_comment = False
                          i += 2
                          continue
                      i += 1
                      continue
                  if in_string:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == in_string:
                          in_string = None
                      i += 1
                      continue
                  if ch == '/' and nxt == '/':
                      in_line_comment = True
                      break
                  if ch == '/' and nxt == '*':
                      in_block_comment = True
                      i += 2
                      continue
                  if ch in ('"', "'"):
                      in_string = ch
                  elif ch == '{':
                      balance += 1
                  elif ch == '}':
                      balance -= 1
                      if balance < 0:
                          print(f'NEGATIVE BRACE BALANCE at line {line_no}: {line.strip()[:240]}')
                  i += 1
              in_line_comment = False
              if line_no >= max(1, len(text.splitlines()) - 12):
                  print(f'brace line {line_no}: {balance} | {line.strip()[:180]}')
          print(f'FINAL BRACE BALANCE: {balance}')
          PY

      - name: Commit repair
        run: |
          if git diff --quiet -- app/src/main/java/com/airdrive/backup/data/repo/BackupRepository.kt; then
            echo 'No repair needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/airdrive/backup/data/repo/BackupRepository.kt
          git commit -m 'Fix BackupRepository malformed newline escape'
          git push

# Diagnostic workflow while the repository build is being stabilized.
