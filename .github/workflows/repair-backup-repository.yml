name: Repair BackupRepository syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnose BackupRepository structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app/src/main/java/com/airdrive/backup/data/repo/BackupRepository.kt').read_text()
          balance = 0
          in_string = None
          escaped = False
          in_line_comment = False
          in_block_comment = False
          class_seen = False
          class_depth = None
          for line_no, line in enumerate(text.splitlines(), 1):
              i = 0
              while i < len(line):
                  ch = line[i]
                  nxt = line[i + 1] if i + 1 < len(line) else ''
                  if in_line_comment:
                      break
                  if in_block_comment:
                      if ch == '*' and nxt == '/':
                          in_block_comment = False
                          i += 2
                          continue
                      i += 1
                      continue
                  if in_string:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == in_string:
                          in_string = None
                      i += 1
                      continue
                  if ch == '/' and nxt == '/':
                      in_line_comment = True
                      break
                  if ch == '/' and nxt == '*':
                      in_block_comment = True
                      i += 2
                      continue
                  if ch in ('"', "'"):
                      in_string = ch
                  elif ch == '{':
                      balance += 1
                  elif ch == '}':
                      balance -= 1
                  i += 1
              in_line_comment = False
              if 'class BackupRepository' in line:
                  class_seen = True
                  print(f'CLASS DECLARATION line {line_no}, balance={balance}')
              if class_seen and class_depth is None and balance == 0 and line_no > 50:
                  class_depth = line_no
                  print(f'FIRST RETURN TO ZERO AFTER CLASS at line {line_no}: {line.strip()[:500]}')
              if line_no >= 88:
                  print(f'brace line {line_no}: {balance} | {line.strip()[:220]}')
          print(f'FINAL BRACE BALANCE: {balance}')
          PY

      - name: No source mutation
        run: echo 'Diagnostic only; source was not modified.'
