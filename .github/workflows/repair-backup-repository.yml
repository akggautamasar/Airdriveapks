name: Repair BackupRepository syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove premature BackupRepository closure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/airdrive/backup/data/repo/BackupRepository.kt')
          lines = path.read_text().splitlines()
          matches = [i for i, line in enumerate(lines) if line.lstrip().startswith('suspend fun runBackupQueue(')]
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one runBackupQueue line, found {len(matches)}')
          i = matches[0]
          line = lines[i]
          if not line.rstrip().endswith('} } } }'):
              raise SystemExit('Unexpected runBackupQueue ending; refusing automatic edit: ' + line[-120:])
          lines[i] = line.rstrip()[:-1]
          path.write_text('\n'.join(lines) + '\n')
          print(f'Removed one premature closing brace from BackupRepository.kt line {i + 1}.')
          PY

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/airdrive/backup/data/repo/BackupRepository.kt
          git commit -m 'Fix BackupRepository class brace balance'
          git push
