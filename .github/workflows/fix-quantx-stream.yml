name: Patch Quantx Streaming

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'make fullscreen player immersive with auto-hiding controls')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Media3 streaming
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/airdrive/backup/quantx/QuantxDriveViewerScreen.kt')
          s = p.read_text()

          s = s.replace(
              'import androidx.media3.exoplayer.ExoPlayer\n',
              'import androidx.media3.exoplayer.ExoPlayer\nimport androidx.media3.exoplayer.source.DefaultMediaSourceFactory\nimport androidx.media3.datasource.DefaultHttpDataSource\n'
          )

          start = s.index('@OptIn(UnstableApi::class)\n@Composable\nprivate fun RemotePlayer')
          end = s.index('\n\n@Composable\nprivate fun RemoteImage', start)

          replacement = '''@OptIn(UnstableApi::class)
          @Composable
          private fun RemotePlayer(
              url: String?,
              mime: String,
              audio: Boolean,
              fullscreen: Boolean,
              onFullscreen: (Boolean) -> Unit,
              authToken: String?
          ) {
              val context = LocalContext.current
              if (url.isNullOrBlank()) { Message("Streaming unavailable"); return }

              val httpFactory = remember(authToken) {
                  DefaultHttpDataSource.Factory()
                      .setConnectTimeoutMs(20_000)
                      .setReadTimeoutMs(120_000)
                      .setAllowCrossProtocolRedirects(true)
                      .setDefaultRequestProperties(
                          buildMap {
                              put("Accept", "*/*")
                              authToken?.takeIf { it.isNotBlank() }?.let { put("Authorization", "Bearer $it") }
                          }
                      )
              }
              val player = remember(url, authToken) {
                  ExoPlayer.Builder(context)
                      .setMediaSourceFactory(DefaultMediaSourceFactory(httpFactory))
                      .build()
              }
              var showFullscreenControl by remember(url, fullscreen) { mutableStateOf(true) }

              LaunchedEffect(showFullscreenControl, fullscreen) {
                  if (showFullscreenControl) {
                      delay(3000)
                      showFullscreenControl = false
                  }
              }

              DisposableEffect(player, url) {
                  // Do not force the MIME type here. Telegram files can have a generic
                  // stored MIME even when the filename is a playable video. Media3 should
                  // inspect the response/content and choose the correct extractor.
                  player.setMediaItem(MediaItem.Builder().setUri(Uri.parse(url)).build())
                  player.prepare()
                  player.playWhenReady = true
                  onDispose { player.release() }
              }

              Box(Modifier.fillMaxSize().background(Color.Black)) {
                  AndroidView(
                      factory = { ctx ->
                          PlayerView(ctx).apply {
                              this.player = player
                              useController = true
                              controllerAutoShow = true
                              controllerHideOnTouch = true
                              setControllerShowTimeoutMs(3000)
                              setOnTouchListener { _, _ ->
                                  showFullscreenControl = true
                                  false
                              }
                          }
                      },
                      update = {
                          it.player = player
                          it.useController = true
                          it.controllerAutoShow = true
                          it.controllerHideOnTouch = true
                          it.setControllerShowTimeoutMs(3000)
                      },
                      modifier = if (fullscreen) Modifier.fillMaxSize() else Modifier.fillMaxWidth().aspectRatio(if (audio) 1.35f else 1.777f)
                  )

                  if (showFullscreenControl) {
                      Surface(
                          modifier = Modifier.align(Alignment.TopEnd).padding(if (fullscreen) 18.dp else 12.dp),
                          shape = MaterialTheme.shapes.medium,
                          color = Color.Black.copy(alpha = 0.70f)
                      ) {
                          IconButton(onClick = {
                              showFullscreenControl = true
                              onFullscreen(!fullscreen)
                          }) {
                              Icon(
                                  if (fullscreen) Icons.Default.FullscreenExit else Icons.Default.Fullscreen,
                                  contentDescription = if (fullscreen) "Exit full screen" else "Full screen",
                                  tint = Color.White
                              )
                          }
                      }
                  }
              }
          }'''
          replacement = replacement.replace('          @Composable', '@Composable').replace('          private fun RemotePlayer', 'private fun RemotePlayer')
          s = s[:start] + replacement + s[end:]

          s = s.replace(
              'RemotePlayer(api.mediaUrl(file.id), file.mime, false, fullscreen, ::setFullscreen)',
              'RemotePlayer(api.mediaUrl(file.id), file.mime, false, fullscreen, ::setFullscreen, api.savedToken)'
          )
          s = s.replace(
              'RemotePlayer(api.mediaUrl(file.id), file.mime, true, fullscreen, ::setFullscreen)',
              'RemotePlayer(api.mediaUrl(file.id), file.mime, true, fullscreen, ::setFullscreen, api.savedToken)'
          )

          p.write_text(s)
          PY

      - name: Commit streaming fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/airdrive/backup/quantx/QuantxDriveViewerScreen.kt .github/workflows/fix-quantx-stream.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(quantx): make video streaming authenticated and adaptive"
          git push
