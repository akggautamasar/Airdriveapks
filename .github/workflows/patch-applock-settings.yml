name: Patch app lock setting
on: [push]
jobs:
  patch:
    if: github.event.head_commit.message != 'chore: remove app lock setting patch workflow'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch settings
        run: |
          python3 -c "from pathlib import Path; p=Path('app/src/main/java/com/airdrive/backup/data/prefs/SettingsStore.kt'); s=p.read_text(); s=s.replace('val INSTALL_GENERATION = intPreferencesKey(\\\"install_generation\\\")','val INSTALL_GENERATION = intPreferencesKey(\\\"install_generation\\\")\\n    val APP_LOCK_ENABLED = booleanPreferencesKey(\\\"app_lock_enabled\\\")',1); s=s.replace('val autoRetryFailed: Flow<Boolean> = context.dataStore.data.map { it[Keys.AUTO_RETRY_FAILED] ?: true }','val autoRetryFailed: Flow<Boolean> = context.dataStore.data.map { it[Keys.AUTO_RETRY_FAILED] ?: true }\\n    val appLockEnabled: Flow<Boolean> = context.dataStore.data.map { it[Keys.APP_LOCK_ENABLED] ?: false }\\n    suspend fun setAppLockEnabled(enabled: Boolean) { context.dataStore.edit { it[Keys.APP_LOCK_ENABLED] = enabled } }',1); p.write_text(s)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/airdrive/backup/data/prefs/SettingsStore.kt
          git commit -m 'Add optional app lock preference'
          git push
