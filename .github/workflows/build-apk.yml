name: Build APK

on:
  workflow_dispatch:
    inputs:
      tdlib_ref:
        description: "tdlib/td git ref to build (branch, tag, or commit)"
        required: false
        default: "d1085f9cebc5a62379991ae1652673954f229c1f"
  push:
    branches: [ "main" ]

# Only one run at a time so the TDLib cache is never written concurrently.
concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout AirDrive
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # android-actions/setup-android@v3 died ~8s into the job once the runners were forced
      # onto Node 24, so the SDK now comes from the runner image, with sdkmanager as a
      # fallback only when the pieces this build needs are missing.
      - name: Use the Android SDK from the runner image
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          test -d "$SDK" || { echo "::error::no Android SDK at $SDK on this runner image"; exit 1; }
          if [ ! -d "$SDK/platforms/android-34" ] || [ ! -d "$SDK/build-tools/34.0.0" ]; then
            MGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
            test -x "$MGR" || MGR=$(find "$SDK" -type f -name sdkmanager -path "*/bin/*" | head -1)
            test -n "$MGR" || { echo "::error::sdkmanager not found under $SDK"; exit 1; }
            yes | "$MGR" --licenses >/dev/null 2>&1 || true
            "$MGR" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          fi
          ls "$SDK/platforms" "$SDK/build-tools"

      - name: Resolve tdlib/td commit
        id: tdlib_ref
        run: |
          REF="${{ github.event.inputs.tdlib_ref || 'd1085f9cebc5a62379991ae1652673954f229c1f' }}"
          SHA=$(git ls-remote https://github.com/tdlib/td.git "refs/heads/$REF" | cut -f1)
          if [ -z "$SHA" ]; then
            SHA=$(git ls-remote https://github.com/tdlib/td.git "refs/tags/$REF" | cut -f1)
          fi
          if [ -z "$SHA" ]; then
            SHA="$REF"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved tdlib/td $REF -> $SHA"

      - name: Cache built TDLib
        id: tdlib_cache
        uses: actions/cache@v4
        with:
          path: td-src/example/android/tdlib
          key: tdlib-android-${{ steps.tdlib_ref.outputs.sha }}

      - name: Clone tdlib/td
        if: steps.tdlib_cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir td-src && cd td-src
          git init -q
          git remote add origin https://github.com/tdlib/td.git
          git fetch --depth 1 origin "${{ steps.tdlib_ref.outputs.sha }}"
          git checkout FETCH_HEAD

      - name: Build TDLib for Android via official Docker build
        if: steps.tdlib_cache.outputs.cache-hit != 'true'
        working-directory: td-src/example/android
        run: |
          docker buildx build \
            --build-arg TDLIB_INTERFACE=Java \
            --output tdlib \
            .

      - name: Inspect TDLib Docker build output
        run: |
          echo "Contents of td-src/example/android/tdlib:"
          find td-src/example/android/tdlib -maxdepth 4 2>&1 | head -200

      - name: Extract TDLib build archive
        run: |
          set -e
          ZIP="td-src/example/android/tdlib/tdlib.zip"
          test -f "$ZIP" || { echo "::error::$ZIP not found"; exit 1; }
          mkdir -p td-src/example/android/tdlib/extracted
          unzip -q -o "$ZIP" -d td-src/example/android/tdlib/extracted
          echo "Extracted contents:"
          find td-src/example/android/tdlib/extracted -maxdepth 5 | head -200

      - name: Vendor TDLib native libraries into app
        run: |
          set -e
          ROOT="td-src/example/android/tdlib/extracted"
          test -d "$ROOT" || { echo "::error::TDLib extracted output directory '$ROOT' does not exist at all"; exit 1; }
          mkdir -p app/src/main/jniLibs
          rm -rf app/src/main/jniLibs/*
          SO_COUNT=0
          while IFS= read -r -d '' so_file; do
            abi_dir=$(basename "$(dirname "$so_file")")
            mkdir -p "app/src/main/jniLibs/$abi_dir"
            cp "$so_file" "app/src/main/jniLibs/$abi_dir/"
            SO_COUNT=$((SO_COUNT + 1))
          done < <(find "$ROOT" \( -name "libtdjni.so" -o -name "libtdjson.so" \) -print0)
          if [ "$SO_COUNT" -eq 0 ]; then
            echo "::error::No libtdjni.so/libtdjson.so files found anywhere under $ROOT"
            exit 1
          fi
          JAVA_SRC_DIR=$(find "$ROOT" -type d -path "*/org/drinkless/tdlib" | head -n1)
          if [ -z "$JAVA_SRC_DIR" ]; then
            echo "::error::Could not find a generated org/drinkless/tdlib Java source directory under $ROOT"
            exit 1
          fi
          PACKAGE_ROOT=$(dirname "$(dirname "$(dirname "$JAVA_SRC_DIR")")")
          mkdir -p app/src/main/java
          rm -rf app/src/main/java/org
          cp -r "$PACKAGE_ROOT/org" app/src/main/java/org
          echo "Vendored $SO_COUNT libtdjni/libtdjson file(s) across ABIs"
          find app/src/main/java/org -maxdepth 4 -type f -name "*.java"

      - name: Check whether release signing secrets are configured
        id: release_signing
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_B64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      # Job logs are only reachable from the Actions UI, so anything that goes wrong is
      # repeated here as a check annotation, which the API can read.
      - name: Build debug APK
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          # The default shell is bash -e, so the build has to be the condition of an if:
          # a bare failing command would end the step before anything could be reported.
          if ./gradlew assembleDebug --console=plain --stacktrace \
              -PTELEGRAM_API_ID="${TELEGRAM_API_ID:-0}" \
              -PTELEGRAM_API_HASH="${TELEGRAM_API_HASH:-}" > gradle-debug.log 2>&1; then
            grep -c "^w: " gradle-debug.log || true
          else
            status=$?
            tail -40 gradle-debug.log
            ERR=$(grep -E "^e: |FAILURE: |Execution failed for |> Task .* FAILED|error:" gradle-debug.log \
              | tail -30 | tr '\n' '|' | tr -d '\r' | sed 's/::/-/g' || true)
            echo "::error::assembleDebug failed (exit $status): ${ERR:0:1900}"
            exit "$status"
          fi
          ls -l app/build/outputs/apk/debug/
          grep -E "^w: " gradle-debug.log | tail -8 || true

      - name: Build signed release APK
        if: steps.release_signing.outputs.enabled == 'true'
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > release.keystore
          export RELEASE_KEYSTORE_PATH="$PWD/release.keystore"
          ./gradlew assembleRelease \
            -PTELEGRAM_API_ID="${TELEGRAM_API_ID:-0}" \
            -PTELEGRAM_API_HASH="${TELEGRAM_API_HASH:-}"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AirDrive-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        if: steps.release_signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AirDrive-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Whatever step dies, this repeats the build log here: annotations are readable over the
      # API, whereas the job log endpoint behind the Actions UI is not reachable from every sandbox.
      - name: Report the build log on failure
        if: failure()
        run: |
          for f in gradle-debug.log gradle-release.log; do
            if [ -s "$f" ]; then
              BODY=$(tail -50 "$f" | tr '\n' '|' | tr -d '\r' | sed 's/::/-/g' || true)
              echo "::error::$f: ${BODY:0:1900}"
            fi
          done
