name: Build APK

on:
  workflow_dispatch:
    inputs:
      tdlib_ref:
        description: "tdlib/td git ref to build (branch, tag, or commit)"
        required: false
        default: "master"
  push:
    branches: [ "main" ]

# Only one run at a time so the TDLib cache is never written concurrently.
concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout AirDrive
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Resolve tdlib/td commit
        id: tdlib_ref
        run: |
          REF="${{ github.event.inputs.tdlib_ref || 'master' }}"
          SHA=$(git ls-remote https://github.com/tdlib/td.git "refs/heads/$REF" | cut -f1)
          if [ -z "$SHA" ]; then
            SHA=$(git ls-remote https://github.com/tdlib/td.git "refs/tags/$REF" | cut -f1)
          fi
          if [ -z "$SHA" ]; then
            SHA="$REF"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved tdlib/td $REF -> $SHA"

      # TDLib's own Android build (compiling OpenSSL + TDLib native code for every ABI)
      # is the slow part of this workflow, typically 45-90 minutes on a fresh cache.
      # Once cached, later runs skip straight to the app build below.
      - name: Cache built TDLib
        id: tdlib_cache
        uses: actions/cache@v4
        with:
          path: td-src/example/android/tdlib
          key: tdlib-android-${{ steps.tdlib_ref.outputs.sha }}

      - name: Clone tdlib/td
        if: steps.tdlib_cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${{ github.event.inputs.tdlib_ref || 'master' }}" \
            https://github.com/tdlib/td.git td-src

      - name: Build TDLib for Android via official Docker build
        if: steps.tdlib_cache.outputs.cache-hit != 'true'
        working-directory: td-src/example/android
        run: |
          docker buildx build \
            --build-arg TDLIB_INTERFACE=JAVA \
            --output tdlib \
            .

      - name: Vendor TDLib native libraries into app
        run: |
          set -e
          SRC="td-src/example/android/tdlib"
          test -d "$SRC/libs" || { echo "::error::TDLib build output missing libs/"; exit 1; }
          test -d "$SRC/java" || { echo "::error::TDLib build output missing java/ (Java interface)"; exit 1; }

          mkdir -p app/src/main/jniLibs
          rm -rf app/src/main/jniLibs/*
          cp -r "$SRC/libs/"* app/src/main/jniLibs/

          mkdir -p app/src/main/java
          rm -rf app/src/main/java/org
          cp -r "$SRC/java/org" app/src/main/java/org

          echo "Vendored ABIs:"; ls app/src/main/jniLibs
          echo "Vendored Java API:"; find app/src/main/java/org -maxdepth 3 -type f -name "*.java"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: Build debug APK
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          ./gradlew assembleDebug \
            -PTELEGRAM_API_ID="${TELEGRAM_API_ID:-0}" \
            -PTELEGRAM_API_HASH="${TELEGRAM_API_HASH:-}"

      - name: Build signed release APK
        if: ${{ secrets.RELEASE_KEYSTORE_B64 != '' }}
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > release.keystore
          export RELEASE_KEYSTORE_PATH="$PWD/release.keystore"
          ./gradlew assembleRelease \
            -PTELEGRAM_API_ID="${TELEGRAM_API_ID:-0}" \
            -PTELEGRAM_API_HASH="${TELEGRAM_API_HASH:-}"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AirDrive-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        if: ${{ secrets.RELEASE_KEYSTORE_B64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: AirDrive-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
