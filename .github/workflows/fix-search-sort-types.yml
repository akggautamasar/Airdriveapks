name: Fix search sort types

on:
  push:
    paths:
      - '.github/workflows/fix-search-sort-types.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Kotlin sort type mismatches
        run: |
          python3 - <<'PY'
          from pathlib import Path

          search = Path('app/src/main/java/com/airdrive/backup/ui/screens/SearchScreen.kt')
          s = search.read_text()
          s = s.replace(
              'private enum class SortOrder(val label: String, val code: Int) {\n'
              '    NEWEST("Newest", 0), OLDEST("Oldest", 4), LARGEST("Largest", 1),\n'
              '    SMALLEST("Smallest", 5), NAME_AZ("Name A–Z", 2), NAME_ZA("Name Z–A", 3)\n'
              '}',
              'private enum class SortOrder(val label: String, val code: String) {\n'
              '    NEWEST("Newest", "newest"), OLDEST("Oldest", "oldest"), LARGEST("Largest", "largest"),\n'
              '    SMALLEST("Smallest", "smallest"), NAME_AZ("Name A–Z", "name"), NAME_ZA("Name Z–A", "name_desc")\n'
              '}'
          )
          search.write_text(s)

          gallery = Path('app/src/main/java/com/airdrive/backup/ui/screens/GalleryScreen.kt')
          g = gallery.read_text()
          old = 'sort = 0, limit = CATEGORY_DETAIL_LIMIT'
          if old in g:
              g = g.replace(old, 'sort = "newest", limit = CATEGORY_DETAIL_LIMIT', 1)
          gallery.write_text(g)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/airdrive/backup/ui/screens/SearchScreen.kt app/src/main/java/com/airdrive/backup/ui/screens/GalleryScreen.kt
          git diff --cached --quiet && exit 0
          git commit -m 'Fix search and gallery sort type mismatches'
          git push
